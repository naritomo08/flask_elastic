x-backend-environment: &backend-environment
  ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
  ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX}

x-backend-extra-hosts: &backend-extra-hosts
  - "elastic1:${ELASTICSEARCH_HOST_IP}"

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend-python
      - backend-go
      - backend-java
      - backend-php
      - backend-ruby
      - backend-elixir
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:514"
        tag: "nginx"
    restart: unless-stopped

  backend-python:
    build: ./backend-python
    restart: unless-stopped
    environment: *backend-environment
    extra_hosts: *backend-extra-hosts

  backend-go:
    build: ./backend-go
    restart: unless-stopped
    environment: *backend-environment
    extra_hosts: *backend-extra-hosts

  backend-java:
    build: ./backend-java
    restart: unless-stopped
    environment: *backend-environment
    extra_hosts: *backend-extra-hosts

  backend-php:
    build: ./backend-php
    restart: unless-stopped
    environment: *backend-environment
    extra_hosts: *backend-extra-hosts

  backend-ruby:
    build: ./backend-ruby
    restart: unless-stopped
    environment: *backend-environment
    extra_hosts: *backend-extra-hosts

  backend-elixir:
    build: ./backend-elixir
    restart: unless-stopped
    environment: *backend-environment
    extra_hosts: *backend-extra-hosts

  backend-contract-tests:
    build: ./backend-python
    profiles:
      - test
    depends_on:
      - backend-python
      - backend-go
      - backend-java
      - backend-php
      - backend-ruby
      - backend-elixir
    volumes:
      - ./tests:/app/tests:ro
    environment:
      BACKEND_TARGETS: flask=http://backend-python:5000,go=http://backend-go:5000,java=http://backend-java:5000,php=http://backend-php:5000,ruby=http://backend-ruby:5000,elixir=http://backend-elixir:5000
      RUN_SEARCH_CONTRACT_TESTS: ${RUN_SEARCH_CONTRACT_TESTS:-0}
    command: ["pytest", "/app/tests"]
