<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Elasticsearchに保存されたログを検索・閲覧するアプリ">
    <title>Elastic Log Explorer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" data-route>
          <span class="brand-mark">E</span>
          <span><strong>Elastic Log Explorer</strong><small>Search across operational logs</small></span>
        </a>
        <div class="header-controls">
          <label class="backend-selector">
            <span>Backend</span>
            <select id="backend-select" aria-label="利用するバックエンド">
              <option value="">確認中…</option>
            </select>
          </label>
          <nav class="header-nav">
            <a href="/search" data-route>ログ一覧</a>
            <a href="/health" data-route>稼働状況</a>
          </nav>
        </div>
      </div>
    </header>

    <main id="app" class="container" aria-live="polite">
      <div class="loading-state">読み込み中…</div>
    </main>

    <footer class="site-footer">
      <div class="container">Operational logs × Elasticsearch × 6 backends</div>
    </footer>

    <dialog id="log-dialog" class="log-dialog">
      <div class="dialog-header">
        <div><p class="eyebrow">LOG DETAIL</p><h2 id="dialog-title">ログ詳細</h2></div>
        <button type="button" class="dialog-close" data-dialog-close aria-label="閉じる">×</button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <script type="module" src="/search.js"></script>
  </body>
</html>
